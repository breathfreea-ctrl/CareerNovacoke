<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{% block title %}Career Match Survey — Hello Future{% endblock %}</title>

  <link
    rel="icon"
    type="image/svg+xml"
    href="{{ url_for('static', filename='favicon.svg') }}"
  >
  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}"
  >

  {% block head %}{% endblock %}
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="site-brand" href="{{ url_for('index') }}">
        <span class="site-brand__mark" aria-hidden="true">H</span>
        <span>Hello Future<span class="site-brand__period">.</span></span>
      </a>
      <span class="site-header__caption">A clearer way forward</span>
    </div>
  </header>

  <main class="wrap">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="site-footer__inner">
      <span class="footer-mark" aria-hidden="true">HF</span>
      <p>Thoughtful guidance for whatever comes next.</p>
      <span class="site-footer__aside">Your path is yours to shape.</span>
    </div>
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
