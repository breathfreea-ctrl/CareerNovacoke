<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{% block title %}Career Match Survey — CareerNovacoke{% endblock %}</title>

  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}"
  >

  {% block head %}{% endblock %}
</head>
  <body>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="site-brand" href="{{ url_for('index') }}">
        CareerNovacoke
      </a>
      <span class="site-header__caption">Career Match Survey</span>
    </div>
  </header>

  <main class="wrap">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <p>Wishing you a better future, hello future!</p>
    <p lang="en">Wishing you a better future, hello future！</p>
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
